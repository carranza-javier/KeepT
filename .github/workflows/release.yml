name: Release

# Builds KeepT on a GitHub-hosted Windows runner when a version tag (vX.Y.Z) is pushed:
# tests, PyInstaller app, Inno Setup installer, SHA-256, GitHub Release.
# Builds are only made here (never on a developer machine), as SignPath Foundation requires.
# Code signing with SignPath is prepared below and stays off until the repository variable
# SIGNPATH_ENABLED is set to "true" (see "Code signing policy" in the README).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SIGNING: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check that the tag matches the app version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $app = python -c "import keept; print(keept.__version__)"
          if ($tag -ne $app) { throw "Tag v$tag does not match keept.__version__ $app" }
          "version=$app" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build the app (PyInstaller)
        run: |
          python tools/make_icon.py packaging/keept.ico
          python -m PyInstaller packaging/keept.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the build
        shell: pwsh
        run: |
          $p = Start-Process dist/KeepT/KeepT.exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "KeepT.exe --version failed ($($p.ExitCode))" }
          $m = Get-Content dist/KeepT/_internal/keept/translate/models_manifest.json -Raw | ConvertFrom-Json
          if (-not $m.base_url -or @($m.models.PSObject.Properties).Count -eq 0) { throw "The models manifest is missing or empty" }

      # -- Code signing of KeepT.exe (SignPath, off until approved) ----------------------
      - name: Upload unsigned app for signing
        id: upload-unsigned-app
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/KeepT/KeepT.exe
          archive: false
          if-no-files-found: error

      - name: Sign KeepT.exe with SignPath
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: dist/KeepT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\keept.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      # -- Code signing of the installer (SignPath, off until approved) ------------------
      - name: Upload unsigned installer for signing
        id: upload-unsigned-installer
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: installer/Output/KeepT-Setup-${{ steps.version.outputs.version }}.exe
          archive: false
          if-no-files-found: error

      - name: Sign the installer with SignPath
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: installer/Output

      - name: SHA-256
        id: hash
        shell: pwsh
        run: |
          $name = "KeepT-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash "installer/Output/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "installer/Output/$name.sha256"
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $signed = if ($env:SIGNING -eq "true") { "Signed with a certificate from SignPath Foundation." } else { "This build is not code signed yet: Windows SmartScreen may warn before running it (More info > Run anyway)." }
          $notes = @"
          Windows installer for KeepT $v (per user, no administrator rights needed).

          SHA-256 of KeepT-Setup-$v.exe: ``${{ steps.hash.outputs.sha256 }}``

          $signed

          Built by GitHub Actions from commit ${{ github.sha }}.
          Translation models are downloaded on first use from the models-v1 release (verified with SHA-256).
          "@
          $notes | Out-File -Encoding utf8 notes.txt
          # 0.x is not stable yet: publish it as a pre-release (never marked as latest).
          if ($v.StartsWith("0.")) { $kind = @("--prerelease", "--latest=false") } else { $kind = @("--latest") }
          gh release create "${{ github.ref_name }}" "installer/Output/KeepT-Setup-$v.exe" "installer/Output/KeepT-Setup-$v.exe.sha256" --title "KeepT $v" --notes-file notes.txt @kind
