name: Translation models

# Converts the OPUS-MT models of keept/translate/catalog.json to CTranslate2 int8 and publishes
# them, with a manifest of sizes and SHA-256 hashes, as assets of a separate release.
# Run it by hand (Actions > Translation models > Run workflow) after changing the catalog.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that holds the models
        default: models-v1
      pairs:
        description: Comma separated pairs to (re)publish, e.g. de-es,en-es (empty = whole catalog)
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter
        run: python -m pip install ctranslate2==4.9.1 sentencepiece==0.2.3 PyYAML==6.0.4 numpy

      - name: Convert and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/publish_models.py --tag "${{ inputs.tag }}" --pairs "${{ inputs.pairs }}"

      - name: Keep the manifest as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: models-manifest
          path: keept/translate/models_manifest.json
